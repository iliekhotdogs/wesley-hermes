{
  "model": {
    "default": "gpt-6.1-sol",
    "provider": "openai-codex"
  },
  "fallback_providers": [],
  "agent": {
    "max_turns": 150,
    "reasoning_effort": "high",
    "verbose": false,
    "disabled_toolsets": []
  },
  "toolsets": [
    "all",
    "kanban"
  ],
  "memory": {
    "memory_enabled": true,
    "user_profile_enabled": false
  },
  "approvals": {
    "mode": "manual",
    "cron_mode": "deny",
    "single_query_mode": "deny",
    "unattended_mode": "deny",
    "destructive_slash_confirm": true
  },
  "command_allowlist": [],
  "plugins": {
    "enabled": [],
    "disabled": [
      "profile-permissions",
      "briefing-curation",
      "second-brain-retrieval"
    ]
  },
  "delegation": {
    "orchestrator_enabled": true,
    "subagent_auto_approve": false,
    "max_concurrent_children": 1
  },
  "tool_loop_guardrails": {
    "warnings_enabled": true,
    "hard_stop_enabled": true,
    "warn_after": {
      "exact_failure": 2,
      "same_tool_failure": 3,
      "idempotent_no_progress": 2
    },
    "hard_stop_after": {
      "exact_failure": 5,
      "same_tool_failure": 8,
      "idempotent_no_progress": 12
    }
  },
  "group_sessions_per_user": true,
  "skills": {
    "write_approval": true,
    "disabled": [
      "youtube-content"
    ]
  },
  "display": {
    "personality": "technical"
  },
  "terminal": {
    "backend": "local",
    "cwd": ".",
    "timeout": 180
  },
  "checkpoints": {
    "enabled": true
  },
  "kanban": {
    "max_in_progress": 2,
    "max_in_progress_per_profile": 1,
    "dispatch_interval_seconds": 5
  }
}
