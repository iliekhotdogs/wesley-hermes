model:
  default: poolside/laguna-s-2.1:free
  provider: nous
fallback_providers:
- provider: openai-codex
  model: gpt-6-sol
  base_url: https://chatgpt.com/backend-api/codex
  api_mode: codex_responses
agent:
  max_turns: 60
  bot_mode_protocol: false
  verify_on_stop: false
  verbose: false
  reasoning_effort: medium
memory:
  memory_enabled: false
  user_profile_enabled: false
skills:
  write_approval: true
command_allowlist: []
plugins:
  enabled: []
_config_version: 45
platform_toolsets:
  cli:
  - code_execution
  - connections
  - file
