  - vision
CANVAS_BASE_URL: https://canvas.sfu.ca
onboarding:
  seen:
    tool_progress_prompt: true
platforms:
  discord:
    enabled: false
mcp_servers:
  github:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-github'
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
