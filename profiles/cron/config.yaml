{
  "model": {
    "default": "gpt-6.1-sol",
    "provider": "openai-codex"
  },
  "fallback_providers": [],
  "agent": {
    "max_turns": 20,
    "reasoning_effort": "low",
    "verbose": false,
    "disabled_toolsets": [
      "delegation",
      "code_execution",
      "computer_use",
      "discord_admin"
    ]
  },
  "toolsets": [
    "connections",
    "cronjob",
    "file",
    "skills",
    "kanban",
    "terminal",
    "web",
    "session_search"
  ],
  "memory": {
    "memory_enabled": false,
    "user_profile_enabled": false
  },
  "approvals": {
    "mode": "manual",
    "cron_mode": "deny",
    "single_query_mode": "deny",
    "unattended_mode": "deny",
    "destructive_slash_confirm": true
  },
  "command_allowlist": [],
  "plugins": {
    "enabled": [],
    "disabled": [
      "profile-permissions",
      "hermes-token-router",
      "briefing-curation",
      "second-brain-retrieval"
    ]
  },
  "delegation": {
    "orchestrator_enabled": false,
    "subagent_auto_approve": false,
    "max_concurrent_children": 1
  },
  "tool_loop_guardrails": {
    "warnings_enabled": true,
    "hard_stop_enabled": true,
    "warn_after": {
      "exact_failure": 1,
      "same_tool_failure": 2,
      "idempotent_no_progress": 2
    },
    "hard_stop_after": {
      "exact_failure": 2,
      "same_tool_failure": 3,
      "idempotent_no_progress": 5
    }
  },
  "group_sessions_per_user": true,
  "skills": {
    "write_approval": true,
    "disabled": []
  }
}
